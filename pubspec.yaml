name: stride
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_foreground_task: ^10.0.0
  flutter_map_cache: ^2.1.0
  http_cache_file_store: ^2.0.0
  path_provider: ^2.1.2
  pedometer: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/icon/splash_logo.png"

  color_dark: "#161c2a"
  image_dark: "assets/icon/splash_logo.png"

  # Android 12+ (API level 31+) native splash screen support
  android_12:
    image: "assets/icon/splash_logo.png"
    icon_background_color: "#ffffff"
    image_dark: "assets/icon/splash_logo.png"
    icon_background_color_dark: "#161c2a"

  android: true
  ios: true

flutter:
  uses-material-design: true
